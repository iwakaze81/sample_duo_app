name: CI

# PR と main への push で、静的解析・テスト・Web ビルド・VRT 用スクリーンショット撮影を行う。
# GitHub Pages への公開は pages.yml (この CI の完了後に workflow_run で起動) が担当する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Pages は https://<user>.github.io/<repo>/ で配信されるので base-href をリポジトリ名にする。
      # CanvasKit も成果物に含めて、gstatic への依存をなくしておく。
      - name: Build web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --no-web-resources-cdn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: web-build
          path: build/web
          retention-days: 30

  # VRT は reg-actions (https://github.com/reg-viz/reg-actions) で行う。
  # - main への push: スクリーンショットをアーティファクト (reg) に保存し、次回以降の比較対象にする
  # - PR: 分岐元 (merge-base) のコミットの reg アーティファクトと比較し、
  #       差分があれば画像付きで PR にコメントする (1 件を更新し続ける)。マージはブロックしない。
  #       コメント用の画像は reg_actions ブランチに push される。
  vrt:
    runs-on: ubuntu-latest
    permissions:
      contents: write # コメント用の画像を reg_actions ブランチに push するため
      pull-requests: write # PR コメント
      actions: read # 比較対象の reg アーティファクトを探すため
    env:
      VRT_CJK_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # reg-actions が merge-base を計算するため

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Japanese font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
          test -f "$VRT_CJK_FONT"

      - run: flutter pub get

      - name: Take screenshots
        run: flutter test test_vrt

      - name: Report URL on Pages
        id: report
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "url=https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/vrt/pr-${PR_NUMBER}/" >> "$GITHUB_OUTPUT"

      - uses: reg-viz/reg-actions@f0cccbcab7e7ecf9b0434b719f1e842c97bcd2a7 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-directory-path: test_vrt/screenshots
          matching-threshold: 0.1
          comment-mode: changes # 差分があるときだけコメント
          outdated-comment-action: update # コメントは 1 件を更新し続ける (差分が消えたら resolved 表示)
          comment-report-format: raw # 変更画面の画像を展開して表示
          # Pages の reg-cli レポート (この CI の完了後に pages.yml が公開する)
          custom-report-page: ${{ steps.report.outputs.url }}

name: Pages

# CI の完了後に GitHub Pages へ公開する。
#
#   /            … main の Web 版 (端末プレビュー付き)
#   /vrt/        … VRT レポート一覧
#   /vrt/main/   … main のスクリーンショット一覧
#   /vrt/pr-N/   … 開いている PR ごとの差分レポート
#
# workflow_run で起動するため、常にデフォルトブランチ (main) のコードで動く。
# PR から受け取るのは PNG だけで、比較と HTML の生成は main のコードで行う。
# Pages のデプロイは毎回サイト全体の置き換えなので、過去の PR レポートは
# 前回のこのワークフローが残したアーティファクト (vrt-site) から引き継ぐ。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-site:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 他のワークフロー実行のアーティファクト取得
      pull-requests: read # 閉じた PR のレポートを掃除するため
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      has_changes: ${{ steps.pr.outputs.has_changes }}
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: ${{ github.workspace }}/_site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/vrt/package-lock.json

      - run: npm ci --prefix tool/vrt

      - name: Download main build and screenshots
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::main の成功した CI 実行が見つかりません"
            exit 1
          fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n web-build -D "$SITE"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n vrt-screenshots -D "$RUNNER_TEMP/main-shots"

      - name: Restore reports of open PRs
        run: |
          mkdir -p "$SITE/vrt"
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$prev" ]; then
            gh run download "$prev" -R "$GITHUB_REPOSITORY" -n vrt-site -D "$RUNNER_TEMP/prev" || true
          fi
          for dir in "$RUNNER_TEMP"/prev/pr-*; do
            [ -d "$dir" ] || continue
            n="${dir##*/pr-}"
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            state=$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json state -q .state || echo UNKNOWN)
            if [ "$state" = "OPEN" ]; then
              cp -r "$dir" "$SITE/vrt/"
            else
              echo "PR #$n は $state のためレポートを削除"
            fi
          done

      - name: main snapshot gallery
        run: |
          node tool/vrt/compare.mjs \
            --actual "$RUNNER_TEMP/main-shots" \
            --out "$SITE/vrt/main" \
            --title "main のスナップショット"

      - name: PR report
        id: pr
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # フォークからの PR では空になる (その場合は公開しない)
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR 番号が取得できないためスキップします (フォークからの PR など)"
            exit 0
          fi
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n vrt-screenshots -D "$RUNNER_TEMP/pr-shots"
          node tool/vrt/compare.mjs \
            --expected "$RUNNER_TEMP/main-shots" \
            --actual "$RUNNER_TEMP/pr-shots" \
            --out "$SITE/vrt/pr-$PR_NUMBER" \
            --title "PR #$PR_NUMBER の VRT" \
            --subtitle-html "<a href=\"https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER\">PR #$PR_NUMBER を開く</a>"

          # PR コメント本文 (画像とレポートは Pages に公開したものを参照する)
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p "$RUNNER_TEMP/vrt-comment"
          node tool/vrt/pr_comment.mjs \
            --results "$SITE/vrt/pr-$PR_NUMBER/results.json" \
            --report-url "https://${owner}.github.io/${repo}/vrt/pr-$PR_NUMBER/" \
            --sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/vrt-comment/comment.md" \
            --github-output "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pr.outputs.pr_number != ''
        with:
          name: vrt-comment
          path: ${{ runner.temp }}/vrt-comment
          retention-days: 7

      - name: Report index
        run: node tool/vrt/site_index.mjs "$SITE/vrt" "$GITHUB_REPOSITORY" "../"

      # 次回の実行で PR レポートを引き継ぐために保存する
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-site
          path: _site/vrt
          retention-days: 90

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Pages に公開された後で PR にコメントする (コメント内の画像とリンクが Pages を指すため)。
  # 差分があるときだけ新規作成し、以降は同じコメントを更新する。
  # 差分が無くなったときは既存のコメントを「差分なし」に更新する (無ければ何もしない)。
  comment:
    needs: [build-site, deploy]
    if: needs.build-site.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.build-site.outputs.pr_number }}
      HAS_CHANGES: ${{ needs.build-site.outputs.has_changes }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vrt-comment
          path: ${{ runner.temp }}/vrt-comment

      - name: Post or update PR comment
        run: |
          body="$RUNNER_TEMP/vrt-comment/comment.md"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- vrt-report -->"))) | .id' \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$body" > /dev/null
            echo "コメントを更新しました: $existing"
          elif [ "$HAS_CHANGES" = "true" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$body" > /dev/null
            echo "コメントを投稿しました"
          else
            echo "差分なし・既存コメントなしのため投稿しません"
          fi
